<!DOCTYPE html>
<html lang="el">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="refresh" content="1; url=leaderboard-standalone.html">
	<title>Μεταφορά στο Leaderboard Suite...</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			background: #0f141c;
			color: #f8fafc;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 20px;
		}
		.card {
			background: #1e2634;
			border: 1px solid rgba(255, 255, 255, 0.1);
			padding: 36px 30px;
			border-radius: 20px;
			text-align: center;
			max-width: 440px;
			width: 100%;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
		}
		.icon-badge {
			width: 60px;
			height: 60px;
			border-radius: 16px;
			background: rgba(59, 130, 246, 0.15);
			color: #60a5fa;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			font-size: 28px;
			margin-bottom: 18px;
		}
		h2 {
			font-size: 22px;
			font-weight: 800;
			margin-bottom: 8px;
		}
		p {
			font-size: 14px;
			color: #94a3b8;
			line-height: 1.5;
			margin-bottom: 22px;
		}
		.spinner {
			width: 32px;
			height: 32px;
			border: 3px solid rgba(255, 255, 255, 0.1);
			border-top-color: #3b82f6;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin: 0 auto 18px auto;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		a.btn {
			display: inline-block;
			background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
			color: #ffffff;
			text-decoration: none;
			padding: 12px 24px;
			border-radius: 12px;
			font-weight: 700;
			font-size: 14px;
			box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
		}
	</style>
</head>
<body>
	<div class="card">
		<div class="icon-badge">🏆</div>
		<h2>Leaderboard & Mystery Cards</h2>
		<div class="spinner"></div>
		<p id="msg">Μεταφορά στη νέα αυτόνομη έκδοση...</p>
		<a class="btn" id="btn-redirect" href="leaderboard-standalone.html">Άμεσο Άνοιγμα</a>
	</div>

	<script>
		// Forward any query string and hash seamlessly
		var target = "leaderboard-standalone.html" + window.location.search + window.location.hash;
		document.getElementById("btn-redirect").href = target;
		setTimeout(function() {
			window.location.replace(target);
		}, 150);
	</script>
</body>
</html>
