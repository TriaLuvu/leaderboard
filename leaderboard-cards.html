<!DOCTYPE html>
<html lang="el">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Μετάβαση στο Νέο Σύστημα Mystery Cards...</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			background: #060813;
			color: #f8fafc;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 20px;
		}
		.bridge-card {
			background: #121a30;
			border: 1.5px solid #8b5cf6;
			padding: 40px 32px;
			border-radius: 24px;
			text-align: center;
			max-width: 480px;
			width: 100%;
			box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(139, 92, 246, 0.2);
		}
		.icon-badge {
			width: 68px;
			height: 68px;
			border-radius: 20px;
			background: rgba(139, 92, 246, 0.2);
			color: #c084fc;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			font-size: 32px;
			margin-bottom: 20px;
		}
		h2 {
			font-size: 24px;
			font-weight: 800;
			margin-bottom: 10px;
			letter-spacing: -0.5px;
		}
		.status-text {
			font-size: 14px;
			color: #94a3b8;
			line-height: 1.6;
			margin-bottom: 24px;
		}
		.badge-found {
			display: inline-block;
			background: rgba(16, 185, 129, 0.2);
			color: #34d399;
			border: 1px solid rgba(16, 185, 129, 0.4);
			padding: 6px 16px;
			border-radius: 999px;
			font-size: 13px;
			font-weight: 700;
			margin-bottom: 20px;
		}
		.spinner {
			width: 36px;
			height: 36px;
			border: 3.5px solid rgba(255, 255, 255, 0.1);
			border-top-color: #8b5cf6;
			border-radius: 50%;
			animation: spin 0.7s linear infinite;
			margin: 0 auto 20px auto;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		a.btn-proceed {
			display: inline-block;
			background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
			color: #ffffff;
			text-decoration: none;
			padding: 13px 28px;
			border-radius: 12px;
			font-weight: 800;
			font-size: 14px;
			box-shadow: 0 6px 18px rgba(139, 92, 246, 0.45);
			transition: transform 0.15s ease;
		}
		a.btn-proceed:hover {
			transform: scale(1.03);
		}
	</style>
</head>
<body>
	<div class="bridge-card">
		<div class="icon-badge">🎴</div>
		<h2>Αναβάθμιση Mystery Cards</h2>
		<div class="spinner"></div>
		<div id="found-badge-wrap"></div>
		<p class="status-text" id="status-msg">
			Εντοπίστηκε το παλιό αρχείο <b>leaderboard-cards.html</b>.<br>
			Οι κάρτες σας μεταφέρονται αυτόματα στη νέα αυτόνομη σουίτα...
		</p>
		<a class="btn-proceed" id="btn-target" href="leaderboard-standalone.html?mode=cards_only">Μετάβαση Τώρα</a>
	</div>

	<script>
		(function() {
			var url = new URL(window.location.href);
			var qParam = url.searchParams.get("q");
			var syncParam = url.searchParams.get("sync");
			
			var targetUrl = "leaderboard-standalone.html?mode=cards_only";
			var foundItems = 0;

			if (qParam) {
				targetUrl += "&q=" + encodeURIComponent(qParam);
			} else if (syncParam) {
				targetUrl += "&sync=" + encodeURIComponent(syncParam);
			} else {
				var cardData = null;
				try {
					var rawCards = localStorage.getItem("leaderboard_card_data");
					if (rawCards) cardData = JSON.parse(rawCards);
				} catch(e) {}

				if (Array.isArray(cardData) && cardData.length > 0) {
					foundItems = cardData.length;
					var payload = { cards: cardData, mode: "cards_only", v: 2 };
					var b64 = btoa(encodeURIComponent(JSON.stringify(payload)));
					targetUrl += "&sync=" + b64;
				}
			}

			if (foundItems > 0) {
				document.getElementById("found-badge-wrap").innerHTML = 
					'<div class="badge-found">✨ Βρέθηκαν ' + foundItems + ' κάρτες από την παλιά έκδοση!</div>';
			}

			document.getElementById("btn-target").href = targetUrl;

			setTimeout(function() {
				window.location.replace(targetUrl);
			}, 600);
		})();
	</script>
</body>
</html>
