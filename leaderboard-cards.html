<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Leaderboard Cards</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<script type="text/javascript" src="jquery-3.5.1.min.js"></script>
<style type="text/css">
:root {
	--bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%, #090d16 100%);
	--card-bg: rgba(30, 41, 59, 0.65);
	--card-border: rgba(255, 255, 255, 0.12);
	--card-hover-border: rgba(99, 102, 241, 0.5);
	--text-main: #f8fafc;
	--text-muted: #94a3b8;
	--accent-primary: #6366f1;
	--dock-bg: rgba(15, 23, 42, 0.85);
	--dock-border: rgba(255, 255, 255, 0.15);
	--font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { margin:0; padding:0; box-sizing: border-box; font-family: var(--font-family); }
html, body { min-height: 100vh; background: #0f172a; color: var(--text-main); }
body {
	background: var(--bg-gradient);
	background-attachment: fixed;
	box-sizing: border-box;
	max-width: 1400px;
	margin: 0 auto;
	padding-bottom: 120px;
	overflow-x: hidden;
}

/* Header */
.lb-header-container {
	text-align: center;
	padding: 36px 20px 24px 20px;
}
h1.lb-header {
	display: inline-block;
	font-size: 48px;
	font-weight: 800;
	letter-spacing: -0.02em;
	background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #a855f7 100%);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	padding: 6px 24px;
	border-radius: 16px;
	outline: none;
	transition: all 0.3s ease;
	cursor: pointer;
}
h1.lb-header:focus, h1.lb-header:hover {
	background: linear-gradient(135deg, #ffffff 0%, #c084fc 100%);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	text-shadow: 0 0 20px rgba(192, 132, 252, 0.3);
}

/* Cards Layout */
.leaderboard { list-style: none; width: 100%; }
.leaderboard .card { padding: 0; width: 20%; height: 420px; overflow: hidden; position: relative; }
.leaderboard .card .card-box { height: 100%; padding: 12px; user-select: none; }
.leaderboard .card .card-box .card-content {
	position: relative;
	background: var(--card-bg);
	backdrop-filter: blur(16px);
	-webkit-backdrop-filter: blur(16px);
	border: 1px solid var(--card-border);
	border-radius: 24px;
	height: 100%;
	text-align: center;
	overflow: hidden;
	box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
	transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.leaderboard .card:hover .card-content {
	border-color: var(--card-hover-border);
	transform: translateY(-4px);
	box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.2);
}

/* Card Cover */
.leaderboard .card .card-box .card-content .card-cover {
	background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
	border: 2px dashed rgba(255, 255, 255, 0.18);
	border-radius: 24px;
	position: absolute;
	top: 0; left: 0;
	width: 100%; height: 100%;
	transition: left 0.45s cubic-bezier(0.16, 1, 0.3, 1);
	cursor: pointer;
	z-index: 10;
	display: flex;
	align-items: center;
	justify-content: center;
	box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
}
.leaderboard .card .card-box .card-content.open .card-cover { left: -105%; }

.leaderboard .card .card-box .card-content .card-cover .number {
	font-size: 85px;
	font-weight: 800;
	background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	filter: drop-shadow(0 4px 10px rgba(245, 158, 11, 0.3));
}

/* Revealed Card Content */
.leaderboard .card .card-box .icon {
	font-size: 64px;
	line-height: 100px;
	background: rgba(255, 255, 255, 0.08);
	border: 1px solid rgba(255, 255, 255, 0.15);
	border-radius: 50%;
	width: 100px;
	height: 100px;
	text-align: center;
	display: inline-block;
	margin: 28px 0 20px 0;
	box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}

.leaderboard .card .score {
	font-size: 32px;
	font-weight: 800;
	line-height: 56px;
	height: 56px;
	background: #334155;
	color: #fff;
	width: 90%;
	margin: 0 auto;
	border-radius: 16px;
	display: flex;
	align-items: center;
	justify-content: center;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}
.leaderboard .card .score.red    { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
.leaderboard .card .score.green  { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
.leaderboard .card .score.yellow { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }

.leaderboard .card .card-box .info {
	color: #cbd5e1;
	font-size: 15px;
	font-weight: 600;
	padding: 16px;
	line-height: 1.4;
}

/* Floating Action Dock */
.action-dock {
	position: fixed;
	bottom: 28px;
	left: 50%;
	transform: translateX(-50%);
	z-index: 100;
	display: flex;
	align-items: center;
	gap: 12px;
	background: var(--dock-bg);
	backdrop-filter: blur(20px);
	-webkit-backdrop-filter: blur(20px);
	border: 1px solid var(--dock-border);
	padding: 10px 18px;
	border-radius: 9999px;
	box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

.dock-item {
	width: 50px;
	height: 50px;
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 22px;
	color: #fff;
	cursor: pointer;
	user-select: none;
	transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
	position: relative;
	background: rgba(255, 255, 255, 0.08);
	border: 1px solid rgba(255, 255, 255, 0.1);
}
.dock-item:hover {
	transform: translateY(-4px) scale(1.1);
	background: rgba(255, 255, 255, 0.18);
	box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}
.dock-item:active {
	transform: translateY(0) scale(0.95);
}

.add-card { background: linear-gradient(135deg, #8b5cf6, #7c3aed) !important; border: none !important; font-size: 30px; font-weight: 600; }
.edit { background: rgba(255, 255, 255, 0.08); }
.shuffle { background: rgba(255, 255, 255, 0.08); }
.refresh { background: rgba(255, 255, 255, 0.08); }
.link { background: rgba(255, 255, 255, 0.08); }

/* Modals & Popups */
.add-card-popup, .edit-popup, .link-popup {
	display: none;
	position: fixed;
	top: 0; left: 0; width: 100%; height: 100%;
	z-index: 300;
	background: rgba(15, 23, 42, 0.8);
	backdrop-filter: blur(12px);
	-webkit-backdrop-filter: blur(12px);
	align-items: center;
	justify-content: center;
	animation: fadeIn 0.25s ease-out;
}
body.show-add-card .add-card-popup,
body.show-edit .edit-popup,
body.show-link .link-popup {
	display: flex;
}
body.show-add-card, body.show-edit, body.show-link {
	overflow: hidden;
}

.modal-box {
	background: rgba(30, 41, 59, 0.95);
	border: 1px solid rgba(255, 255, 255, 0.15);
	border-radius: 28px;
	width: 90%;
	max-width: 480px;
	padding: 32px;
	position: relative;
	box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
	text-align: center;
	animation: modalSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-box h2 {
	font-size: 22px;
	font-weight: 800;
	color: #fff;
	margin-bottom: 20px;
}

.modal-box .random-icon {
	width: 120px;
	height: 120px;
	font-size: 70px;
	line-height: 115px;
	background: rgba(255, 255, 255, 0.06);
	border: 2px dashed rgba(255, 255, 255, 0.2);
	border-radius: 50%;
	margin: 0 auto 20px auto;
	text-align: center;
	color: #fff;
	outline: none;
	transition: border-color 0.2s ease, transform 0.2s ease;
	cursor: pointer;
}
.modal-box .random-icon:focus, .modal-box .random-icon:hover {
	border-color: #a855f7;
	transform: scale(1.05);
}

.modal-box input[type="text"],
.modal-box textarea {
	width: 100%;
	background: rgba(15, 23, 42, 0.7);
	border: 1px solid rgba(255, 255, 255, 0.12);
	border-radius: 14px;
	color: #fff;
	font-size: 18px;
	padding: 14px 18px;
	margin-bottom: 14px;
	outline: none;
	transition: all 0.2s ease;
}
.modal-box input:focus, .modal-box textarea:focus {
	border-color: #a855f7;
	box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
}

.modal-box textarea {
	height: 220px;
	resize: vertical;
	font-family: monospace;
	font-size: 15px;
	line-height: 1.5;
}

.modal-actions {
	display: flex;
	gap: 12px;
	margin-top: 10px;
}
.modal-actions button {
	flex: 1;
	height: 50px;
	border-radius: 14px;
	border: none;
	font-size: 16px;
	font-weight: 700;
	cursor: pointer;
	transition: all 0.2s ease;
}
.modal-actions button.cancel {
	background: rgba(255, 255, 255, 0.08);
	color: #cbd5e1;
}
.modal-actions button.cancel:hover {
	background: rgba(255, 255, 255, 0.15);
	color: #fff;
}
.modal-actions button.ok {
	background: linear-gradient(135deg, #10b981, #059669);
	color: #fff;
	box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
}
.modal-actions button.ok:hover {
	filter: brightness(1.1);
	transform: translateY(-1px);
}
.modal-actions button.close {
	width: 100%;
	background: linear-gradient(135deg, #8b5cf6, #7c3aed);
	color: #fff;
	box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
}

/* Media Queries for responsive cards grid */
@media (max-width: 575px) {
	.leaderboard .card { width: 100%; }
}
@media (min-width: 576px) and (max-width: 767px) {
	.leaderboard .card { width: 50%; }
}
@media (min-width: 768px) and (max-width: 991px) {
	.leaderboard .card { width: 33.333%; }
}
@media (min-width: 992px) and (max-width: 1199px) {
	.leaderboard .card { width: 25%; }
}
@media (min-width: 1200px) {
	.leaderboard .card { width: 20%; }
}

@keyframes fadeIn {
	from { opacity: 0; }
	to { opacity: 1; }
}

@keyframes modalSlide {
	from { opacity: 0; transform: translateY(20px) scale(0.95); }
	to { opacity: 1; transform: translateY(0) scale(1); }
}
</style>
</head>
<body>
	<div class="lb-header-container">
		<h1 contenteditable="true" class="lb-header">Leaderboard Cards</h1>
	</div>

	<ul class="leaderboard">
		<!-- place for cards / isotope plugin -->
	</ul>

	<!-- Popups -->
	<div class="add-card-popup">
		<div class="modal-box">
			<h2>Add Mystery Card</h2>
			<input type="text" id="rand-icon" class="random-icon" value="🦊">
			<input type="text" id="score" placeholder="Score impact (e.g. +5 or -2)">
			<input type="text" id="info" size="15" placeholder="Description / Info">
			<div class="modal-actions">
				<button class="cancel">CANCEL</button>
				<button class="ok">OK</button>
			</div>
		</div>
	</div>

	<div class="edit-popup">
		<div class="modal-box">
			<h2>Bulk Edit Cards</h2>
			<textarea id="tarea" placeholder="icon,score,info"></textarea>
			<div class="modal-actions">
				<button class="cancel">CANCEL</button>
				<button class="ok">OK</button>
			</div>
		</div>
	</div>

	<div class="link-popup">
		<div class="modal-box">
			<h2>Share Cards Game</h2>
			<textarea id="tarea-link" readonly></textarea>
			<div class="modal-actions">
				<button class="close">CLOSE</button>
			</div>
		</div>
	</div>

	<!-- Floating Action Dock -->
	<div class="action-dock">
		<div class="dock-item add-card" title="Add Card">+</div>
		<div class="dock-item edit" title="Bulk Edit">📋</div>
		<div class="dock-item shuffle" title="Shuffle Cards">🃏</div>
		<div class="dock-item refresh" title="Refresh / Reset">🔁</div>
		<div class="dock-item link" title="Share Link">🔗</div>
	</div>

<script type="text/javascript" src="isotope-v3.0.6.pkgd.min.js"></script>
<script type="text/javascript">
var leaderboard_iso = null;
var local_storage_available = false;
var data            = [];
var minusPressed    = false;
var plusPressed     = false;
var emojis          = "🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐽 🐸 🐵 🙈 🙉 🙊 🐒 🐔 🐧 🐦 🐤 🐣 🐥 🦆 🦅 🦉 🦇 🐺 🐗 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐜 🦟 🦗 🕷 🕸 🦂 🐢 🐍 🦎 🦖 🦕 🐙 🦑 🦐 🦞 🦀 🐡 🐠 🐟 🐬 🐳 🐋 🦈 🐊 🐅 🐆 🦓 🦍 🦧 🐘 🦛 🦏 🐪 🐫 🦒 🦘 🐃 🐂 🐄 🐎 🐖 🐏 🐑 🦙 🐐 🦌 🐕 🐩 🦮 🐕‍🦺 🐈 🐓 🦃 🦚 🦜 🦢 🦩 🐇 🦝 🦨 🦡 🦦 🦥 🐁 🐀 🦔".split(" ");
var template        = `
<li class="card">
	<div class="card-box">
	<div class="card-content">
		<div class="card-cover"> <p class="number"></p> </div>
		<p class="icon">{{icon}}</p>
		<p class="score">{{score}}</p>
		<p class="info">{{info}}</p>
	</div>
	</div>
</li>
`;

$( document ).ready(function() {

	test_local_storage();
	initialize_basic_btn_listeners();

	leaderboard_iso = $('.leaderboard').isotope({
		itemSelector: '.card',
	});

	// 1st step: check URL query string
	url = new URL((window.location.href));
	query_string = url.searchParams.get("q");
	if (query_string != null) {
		decoded_str = decodeURIComponent(window.atob(query_string));
		data = JSON.parse(decoded_str);

		if (local_storage_available) {
			localStorage.setItem('leaderboard_card_data', JSON.stringify(data));
			window.location.href = [location.protocol, '//', location.host, location.pathname].join('');
		}
		return;
	}

	// 2nd step: check local storage
	if (local_storage_available) {
		data = JSON.parse(localStorage.getItem('leaderboard_card_data'));
		
		if (data != null) {
			data = shuffleArray(data);
			build_leaderboard_cards();
			return;
		} else {
			data = [];
		}
	}

	// 3rd step: default fallback data
	data = [
			{icon: "🎁", score: "2",  info: "Congrats! You win 2 points"},
			{icon: "🔥", score: "5",  info: "You're on fire! +5" },
			{icon: "🙊", score: "-1",   info: "Whoever you choose loses 1 point" },
			{icon: "🤯", score: "🤣🔁😠",   info: "Swap your score with someone else" },
			{icon: "🥇", score: "-3",   info: "The leader loses 3 points" },
		];
	data = shuffleArray(data);
	build_leaderboard_cards();
});

function sort_leaderboard(){
	leaderboard_iso.isotope( 'updateSortData');
	leaderboard_iso.isotope({ sortBy: "score", sortAscending : false });
}

function shuffle_leaderboard_cards(){
	leaderboard_iso.isotope();
	leaderboard_iso.isotope( 'shuffle' );
}

function add_card_numbers() {
	$('.card-content .number').each(function(i, obj) {
		$(this).text(++i);
	});
}

function add_card_colors() {
	$('.card-content .score').each(function(i, obj) {
		parsed = parseInt( $(this).text() );
		if (isNaN(parsed)) {
			$(this).addClass("yellow").removeClass("red green");
		} else if (parsed > 0) {
			$(this).addClass("green").removeClass("red yellow");
		} else if (parsed < 0) {
			$(this).addClass("red").removeClass("green yellow");
		}
	});
}

function initialize_basic_btn_listeners() {

	$(window).keydown(function(evt) {
		if (evt.which == 109) minusPressed = true;
	}).keyup(function(evt) {
		if (evt.which == 109) minusPressed = false;
	});

	$(window).keydown(function(evt) {
		if (evt.which == 107) plusPressed = true;
	}).keyup(function(evt) {
		if (evt.which == 107) plusPressed = false;
	});
	
	$('.add-card').on('click',function(){
		scroll_to_top_smooth();
		$("body").toggleClass("show-add-card");
		$('#rand-icon').val(emojis[getRandomInt(0,emojis.length)]);
		$('#info').val("");
		$('#score').val("");
	});

	$('.add-card-popup .cancel').on('click',function(){
		$("body").toggleClass("show-add-card");
	});

	$('.add-card-popup .ok').on('click',function(){
		var new_card = {
			icon:  $('#rand-icon').val(),
			info:  $('#info').val(),
			score: $('#score').val()
		};
		data.push(new_card);
		build_leaderboard_cards();
		$("body").toggleClass("show-add-card");
	});

	$('.edit').on('click',function(){
		scroll_to_top_smooth();
		$("body").toggleClass("show-edit");
		data_str = "";
		data.forEach(function(card) {
			data_str = data_str + (card.icon + "," + card.score + "," + card.info + "\n");
		});
		$("#tarea").val(data_str);
	});

	$('.edit-popup .cancel').on('click',function(){
		$("body").toggleClass("show-edit");
	});

	$('.edit-popup .ok').on('click',function(){
		read_data_from_text( $('#tarea').val().trim() );
		build_leaderboard_cards();
		$("body").toggleClass("show-edit");
	});

	$('.link').on('click',function(){
		scroll_to_top_smooth();
		$("body").toggleClass("show-link");
		$("#tarea-link").val(generate_share_link());
		$('#tarea-link').select();

		var shareText = $('#tarea-link').val();
		var $closeBtn = $('.link-popup .close');
		var originalText = $closeBtn.text();
		function showCopiedFeedback(success){
			$closeBtn.text(success ? 'COPIED ✓ — CLOSE' : 'COPY FAILED — CLOSE');
			setTimeout(function(){ $closeBtn.text(originalText); }, 1500);
		}
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(shareText).then(function(){
				showCopiedFeedback(true);
			}).catch(function(){
				try {
					var successful = document.execCommand('copy');
					showCopiedFeedback(!!successful);
				} catch (err) {
					showCopiedFeedback(false);
				}
			});
		} else {
			try {
				var successful = document.execCommand('copy');
				showCopiedFeedback(!!successful);
			} catch (err) {
				showCopiedFeedback(false);
			}
		}
	});

	$('.link-popup .close').on('click',function(){
		$("body").toggleClass("show-link");
	});

	$('.shuffle').on('click',function(){
		shuffle_leaderboard_cards();
	});

	$('.refresh').on('click',function(){
		build_leaderboard_cards();
	});
}

function initialize_card_btn_listeners() {
	$('.card .card-cover').on('click',function(){
		$(this).parent().toggleClass("open");
		if (plusPressed) {
			$(this).parent().children('.icon').text(emojis[getRandomInt(0,emojis.length)]);
			$(this).parent().children('.score').removeClass("red yellow").addClass("green").text(10);
			$(this).parent().children('.info').text("Συγχαρητήρια! Κέρδισες 10 βαθμούς");
		}
		if (minusPressed) {
			$(this).parent().children('.icon').text(emojis[getRandomInt(0,emojis.length)]);
			$(this).parent().children('.score').addClass("red").removeClass("yellow green").text(-10);
			$(this).parent().children('.info').text("Ατυχία! Μόλις έχασες 10 βαθμούς");
		}
	});
}

function build_leaderboard_cards() {
	$('.leaderboard').empty();

	if (data.length == 0) return;

	data = shuffleArray(data);

	data.forEach(function(card) {
		$('.leaderboard').append(
			template.replace(/{{icon}}/gm,card.icon)
					.replace(/{{info}}/gm,card.info)
					.replace(/{{score}}/gm,card.score));
	});

	leaderboard_iso.isotope('reloadItems');
	add_card_numbers();
	add_card_colors();

	localStorage.setItem('leaderboard_card_data', JSON.stringify(data));
	initialize_card_btn_listeners();
	leaderboard_iso.isotope();
}

function read_data_from_text(data_str) {
	data = [];
	if (data_str == "") {return;}
	var lines = data_str.split('\n');
	lines.forEach(function(line) {
		tokens = line.split(',');
		if (tokens.length >= 3) {
			data.push({
				icon:  tokens[0].trim(),
				score: tokens[1].trim(),
				info:  tokens[2].trim()
			});
		}
	});
}

function getRandomInt(min, max) {
    min = Math.ceil(min);
    max = Math.floor(max);
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generate_share_link() {
	base64_str = btoa(encodeURIComponent(JSON.stringify(data)));

function shuffleArray(array) {
	for (var i = array.length - 1; i > 0; i--) {
		var j = Math.floor(Math.random() * (i + 1));
		var temp = array[i];
		array[i] = array[j];
		array[j] = temp;
	}
	return array;
}
