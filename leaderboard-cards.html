<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Leaderboard Cards</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<script type="text/javascript" src="jquery-3.5.1.min.js"></script>
<style type="text/css">
:root {
	--bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%, #090d16 100%);
	--card-bg: rgba(30, 41, 59, 0.65);
	--card-border: rgba(255, 255, 255, 0.12);
	--card-hover-border: rgba(99, 102, 241, 0.5);
	--text-main: #f8fafc;
	--text-muted: #94a3b8;
	--accent-primary: #6366f1;
	--dock-bg: rgba(15, 23, 42, 0.85);
	--dock-border: rgba(255, 255, 255, 0.15);
	--font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { margin:0; padding:0; box-sizing: border-box; font-family: var(--font-family); }
html, body { min-height: 100vh; background: #0f172a; color: var(--text-main); }
body {
	background: var(--bg-gradient);
	background-attachment: fixed;
	box-sizing: border-box;
	max-width: 1400px;
	margin: 0 auto;
	padding-bottom: 120px;
	overflow-x: hidden;
}

/* Header */
.lb-header-container {
	text-align: center;
	padding: 36px 20px 24px 20px;
}
h1.lb-header {
	display: inline-block;
	font-size: 48px;
	font-weight: 800;
	letter-spacing: -0.02em;
	background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #a855f7 100%);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	padding: 6px 24px;
	border-radius: 16px;
	outline: none;
	transition: all 0.3s ease;
	cursor: pointer;
}
h1.lb-header:focus, h1.lb-header:hover {
	background: linear-gradient(135deg, #ffffff 0%, #c084fc 100%);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	text-shadow: 0 0 20px rgba(192, 132, 252, 0.3);
}

/* Cards Layout */
.leaderboard { list-style: none; width: 100%; }
.leaderboard .card { padding: 0; width: 20%; height: 420px; overflow: hidden; position: relative; }
.leaderboard .card .card-box { height: 100%; padding: 12px; user-select: none; }
.leaderboard .card .card-box .card-content {
	position: relative;
	background: var(--card-bg);
	backdrop-filter: blur(16px);
	-webkit-backdrop-filter: blur(16px);
	border: 1px solid var(--card-border);
	border-radius: 24px;
	height: 100%;
	text-align: center;
	overflow: hidden;
	box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
	transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.leaderboard .card:hover .card-content {
	border-color: var(--card-hover-border);
	transform: translateY(-4px);
	box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.2);
}

/* Card Cover */
.leaderboard .card .card-box .card-content .card-cover {
	background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
	border: 2px dashed rgba(255, 255, 255, 0.18);
	border-radius: 24px;
	position: absolute;
	top: 0; left: 0;
	width: 100%; height: 100%;
	transition: left 0.45s cubic-bezier(0.16, 1, 0.3, 1);
	cursor: pointer;
	z-index: 10;
	display: flex;
	align-items: center;
	justify-content: center;
	box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
}
.leaderboard .card .card-box .card-content.open .card-cover { left: -105%; }

.leaderboard .card .card-box .card-content .card-cover .number {
	font-size: 85px;
	font-weight: 800;
	background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	filter: drop-shadow(0 4px 10px rgba(245, 158, 11, 0.3));
}

/* Revealed Card Content */
.leaderboard .card .card-box .icon {
	font-size: 64px;
	line-height: 100px;
	background: rgba(255, 255, 255, 0.08);
	border: 1px solid rgba(255, 255, 255, 0.15);
	border-radius: 50%;
	width: 100px;
	height: 100px;
	text-align: center;
	display: inline-block;
	margin: 28px 0 20px 0;
	box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}

.leaderboard .card .score {
	font-size: 32px;
	font-weight: 800;
	line-height: 56px;
	height: 56px;
	background: #334155;
	color: #fff;
	width: 90%;
	margin: 0 auto;
	border-radius: 16px;
	display: flex;
	align-items: center;
	justify-content: center;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}
.leaderboard .card .score.red    { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
.leaderboard .card .score.green  { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
.leaderboard .card .score.yellow { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }

.leaderboard .card .card-box .info {
	color: #cbd5e1;
	font-size: 15px;
	font-weight: 600;
	padding: 16px;
	line-height: 1.4;
}

/* Floating Action Dock */
.action-dock {
	position: fixed;
	bottom: 28px;
	left: 50%;
	transform: translateX(-50%);
	z-index: 100;
	display: flex;
	align-items: center;
	gap: 12px;
	background: var(--dock-bg);
	backdrop-filter: blur(20px);
	-webkit-backdrop-filter: blur(20px);
	border: 1px solid var(--dock-border);
	padding: 10px 18px;
	border-radius: 9999px;
	box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

.dock-item {
	width: 50px;
	height: 50px;
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 22px;
	color: #fff;
	cursor: pointer;
	user-select: none;
	transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
	position: relative;
	background: rgba(255, 255, 255, 0.08);
	border: 1px solid rgba(255, 255, 255, 0.1);
}
.dock-item:hover {
	transform: translateY(-4px) scale(1.1);
	background: rgba(255, 255, 255, 0.18);
	box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}
.dock-item:active {
	transform: translateY(0) scale(0.95);
}

.add-card { background: linear-gradient(135deg, #8b5cf6, #7c3aed) !important; border: none !important; font-size: 30px; font-weight: 600; }
.edit { background: rgba(255, 255, 255, 0.08); }
.shuffle { background: rgba(255, 255, 255, 0.08); }
.refresh { background: rgba(255, 255, 255, 0.08); }
.sound-toggle { background: rgba(255, 255, 255, 0.08); }
.link { background: rgba(255, 255, 255, 0.08); }

/* Modals & Popups */
.add-card-popup, .edit-popup, .link-popup {
	display: none;
	position: fixed;
	top: 0; left: 0; width: 100%; height: 100%;
	z-index: 300;
	background: rgba(15, 23, 42, 0.8);
	backdrop-filter: blur(12px);
	-webkit-backdrop-filter: blur(12px);
	align-items: center;
	justify-content: center;
	animation: fadeIn 0.25s ease-out;
}
body.show-add-card .add-card-popup,
body.show-edit .edit-popup,
body.show-link .link-popup {
	display: flex;
}
body.show-add-card, body.show-edit, body.show-link {
	overflow: hidden;
}

.modal-box {
	background: rgba(30, 41, 59, 0.95);
	border: 1px solid rgba(255, 255, 255, 0.15);
	border-radius: 28px;
	width: 90%;
	max-width: 480px;
	padding: 32px;
	position: relative;
	box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
	text-align: center;
	animation: modalSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-box h2 {
	font-size: 22px;
	font-weight: 800;
	color: #fff;
	margin-bottom: 20px;
}

.modal-box .random-icon {
	width: 120px;
	height: 120px;
	font-size: 70px;
	line-height: 115px;
	background: rgba(255, 255, 255, 0.06);
	border: 2px dashed rgba(255, 255, 255, 0.2);
	border-radius: 50%;
	margin: 0 auto 20px auto;
	text-align: center;
	color: #fff;
	outline: none;
	transition: border-color 0.2s ease, transform 0.2s ease;
	cursor: pointer;
}
.modal-box .random-icon:focus, .modal-box .random-icon:hover {
	border-color: #a855f7;
	transform: scale(1.05);
}

.modal-box input[type="text"],
.modal-box textarea {
	width: 100%;
	background: rgba(15, 23, 42, 0.7);
	border: 1px solid rgba(255, 255, 255, 0.12);
	border-radius: 14px;
	color: #fff;
	font-size: 18px;
	padding: 14px 18px;
	margin-bottom: 14px;
	outline: none;
	transition: all 0.2s ease;
}
.modal-box input:focus, .modal-box textarea:focus {
	border-color: #a855f7;
	box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
}

.modal-box textarea {
	height: 220px;
	resize: vertical;
	font-family: monospace;
	font-size: 15px;
	line-height: 1.5;
}

.modal-actions {
	display: flex;
	gap: 12px;
	margin-top: 10px;
}
.modal-actions button {
	flex: 1;
	height: 50px;
	border-radius: 14px;
	border: none;
	font-size: 16px;
	font-weight: 700;
	cursor: pointer;
	transition: all 0.2s ease;
}
.modal-actions button.cancel {
	background: rgba(255, 255, 255, 0.08);
	color: #cbd5e1;
}
.modal-actions button.cancel:hover {
	background: rgba(255, 255, 255, 0.15);
	color: #fff;
}
.modal-actions button.ok {
	background: linear-gradient(135deg, #10b981, #059669);
	color: #fff;
	box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
}
.modal-actions button.ok:hover {
	filter: brightness(1.1);
	transform: translateY(-1px);
}
.modal-actions button.close {
	width: 100%;
	background: linear-gradient(135deg, #8b5cf6, #7c3aed);
	color: #fff;
	box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
}

@media (max-width: 575px) {
	.leaderboard .card { width: 100%; }
}
@media (min-width: 576px) and (max-width: 767px) {
	.leaderboard .card { width: 50%; }
}
@media (min-width: 768px) and (max-width: 991px) {
	.leaderboard .card { width: 33.333%; }
}
@media (min-width: 992px) and (max-width: 1199px) {
	.leaderboard .card { width: 25%; }
}
@media (min-width: 1200px) {
	.leaderboard .card { width: 20%; }
}

@keyframes fadeIn {
	from { opacity: 0; }
	to { opacity: 1; }
}

@keyframes modalSlide {
	from { opacity: 0; transform: translateY(20px) scale(0.95); }
	to { opacity: 1; transform: translateY(0) scale(1); }
}
</style>
</head>

<script type="text/javascript">
// --- Audio Engine (Web Audio API) ---
var AudioEngine = (function() {
    var audioCtx = null;
    var isMuted = localStorage.getItem('sound_muted') === 'true';

    function getContext() {
        if (!audioCtx) {
            var AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playTone(freq, type, duration, delay) {
        if (isMuted) return;
        var ctx = getContext();
        if (!ctx) return;
        setTimeout(function() {
            try {
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }, delay || 0);
    }

    return {
        isMuted: function() { return isMuted; },
        toggleMute: function() {
            isMuted = !isMuted;
            localStorage.setItem('sound_muted', isMuted ? 'true' : 'false');
            return isMuted;
        },
        playPositive: function() {
            playTone(523.25, 'sine', 0.15, 0);   // C5
            playTone(659.25, 'sine', 0.15, 60);  // E5
            playTone(783.99, 'sine', 0.25, 120); // G5
        },
        playNegative: function() {
            playTone(392.00, 'triangle', 0.15, 0);   // G4
            playTone(311.13, 'triangle', 0.25, 80);  // Eb4
        },
        playFlip: function() {
            playTone(440, 'sine', 0.08, 0);
            playTone(880, 'sine', 0.08, 30);
        },
        playShuffle: function() {
            for (var i = 0; i < 5; i++) {
                playTone(300 + i * 80, 'triangle', 0.05, i * 40);
            }
        },
        playMilestone: function() {
            playTone(523.25, 'sine', 0.2, 0);
            playTone(659.25, 'sine', 0.2, 80);
            playTone(783.99, 'sine', 0.2, 160);
            playTone(1046.50, 'triangle', 0.4, 240);
        }
    };
})();

// --- Confetti Celebration Engine ---
var ConfettiEngine = (function() {
    var canvas = null;
    var ctx = null;
    var particles = [];
    var animationId = null;

    function init() {
        if (!canvas) {
            canvas = document.createElement('canvas');
            canvas.id = 'confetti-canvas';
            canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
            document.body.appendChild(canvas);
            ctx = canvas.getContext('2d');
            resize();
            window.addEventListener('resize', resize);
        }
    }

    function resize() {
        if (canvas) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
    }

    function launch(count) {
        init();
        var colors = ['#f43f5e', '#10b981', '#6366f1', '#f59e0b', '#ec4899', '#3b82f6', '#a855f7'];
        count = count || 80;
        for (var i = 0; i < count; i++) {
            particles.push({
                x: canvas.width / 2 + (Math.random() * 200 - 100),
                y: canvas.height * 0.4 + (Math.random() * 100 - 50),
                vx: (Math.random() - 0.5) * 16,
                vy: Math.random() * -14 - 6,
                size: Math.random() * 8 + 6,
                color: colors[Math.floor(Math.random() * colors.length)],
                rotation: Math.random() * 360,
                rSpeed: (Math.random() - 0.5) * 10,
                opacity: 1,
                decay: Math.random() * 0.015 + 0.01
            });
        }
        if (!animationId) {
            update();
        }
    }

    function update() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var i = particles.length - 1; i >= 0; i--) {
            var p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.4;
            p.vx *= 0.98;
            p.rotation += p.rSpeed;
            p.opacity -= p.decay;

            if (p.opacity <= 0 || p.y > canvas.height) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = p.opacity;
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
        }

        if (particles.length > 0) {
            animationId = requestAnimationFrame(update);
        } else {
            animationId = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    return { launch: launch };
})();

$( document ).ready(function() {

	test_local_storage();
	initialize_basic_btn_listeners();

	update_sound_icon();

	leaderboard_iso = $('.leaderboard').isotope({
		itemSelector: '.card',
	});

	url = new URL((window.location.href));
	query_string = url.searchParams.get("q");
	if (query_string != null) {
		decoded_str = decodeURIComponent(window.atob(query_string));
		data = JSON.parse(decoded_str);

		if (local_storage_available) {
			localStorage.setItem('leaderboard_card_data', JSON.stringify(data));
			window.location.href = [location.protocol, '//', location.host, location.pathname].join('');
		}
		return;
	}

	if (local_storage_available) {
		data = JSON.parse(localStorage.getItem('leaderboard_card_data'));
		
		if (data != null) {
			data = shuffleArray(data);
			build_leaderboard_cards();
			return;
		} else {
			data = [];
		}
	}

	data = [
			{icon: "🎁", score: "2",  info: "Congrats! You win 2 points"},
			{icon: "🔥", score: "5",  info: "You're on fire! +5" },
			{icon: "🙊", score: "-1",   info: "Whoever you choose loses 1 point" },
			{icon: "🤯", score: "🤣🔁😠",   info: "Swap your score with someone else" },
			{icon: "🥇", score: "-3",   info: "The leader loses 3 points" },
		];
	data = shuffleArray(data);
	build_leaderboard_cards();
});

function update_sound_icon() {
	$('.sound-toggle').text(AudioEngine.isMuted() ? '🔇' : '🔊');
}

function sort_leaderboard(){
	leaderboard_iso.isotope( 'updateSortData');
	leaderboard_iso.isotope({ sortBy: "score", sortAscending : false });
}

function shuffle_leaderboard_cards(){
	leaderboard_iso.isotope();
	leaderboard_iso.isotope( 'shuffle' );
	AudioEngine.playShuffle();
}

function add_card_numbers() {
	$('.card-content .number').each(function(i, obj) {
		$(this).text(++i);
	});
}

function add_card_colors() {
	$('.card-content .score').each(function(i, obj) {
		parsed = parseInt( $(this).text() );
		if (isNaN(parsed)) {
			$(this).addClass("yellow").removeClass("red green");
		} else if (parsed > 0) {
			$(this).addClass("green").removeClass("red yellow");
		} else if (parsed < 0) {
			$(this).addClass("red").removeClass("green yellow");
		}
	});
}

function initialize_basic_btn_listeners() {

	$(window).keydown(function(evt) {
		if (evt.which == 109) minusPressed = true;
	}).keyup(function(evt) {
		if (evt.which == 109) minusPressed = false;
	});

	$(window).keydown(function(evt) {
		if (evt.which == 107) plusPressed = true;
	}).keyup(function(evt) {
		if (evt.which == 107) plusPressed = false;
	});
	
	$('.add-card').on('click',function(){
		scroll_to_top_smooth();
		$("body").toggleClass("show-add-card");
		$('#rand-icon').val(emojis[getRandomInt(0,emojis.length)]);
		$('#info').val("");
		$('#score').val("");
	});

	$('.add-card-popup .cancel').on('click',function(){
		$("body").toggleClass("show-add-card");
	});

	$('.add-card-popup .ok').on('click',function(){
		var new_card = {
			icon:  $('#rand-icon').val(),
			info:  $('#info').val(),
			score: $('#score').val()
		};
		data.push(new_card);
		build_leaderboard_cards();
		$("body").toggleClass("show-add-card");
		AudioEngine.playFlip();
	});

	$('.edit').on('click',function(){
		scroll_to_top_smooth();
		$("body").toggleClass("show-edit");
		data_str = "";
		data.forEach(function(card) {
			data_str = data_str + (card.icon + "," + card.score + "," + card.info + "\n");
		});
		$("#tarea").val(data_str);
	});

	$('.edit-popup .cancel').on('click',function(){
		$("body").toggleClass("show-edit");
	});

	$('.edit-popup .ok').on('click',function(){
		read_data_from_text( $('#tarea').val().trim() );
		build_leaderboard_cards();
		$("body").toggleClass("show-edit");
		AudioEngine.playFlip();
	});

	$('.sound-toggle').on('click', function(){
		AudioEngine.toggleMute();
		update_sound_icon();
	});

	$('.link').on('click',function(){
		scroll_to_top_smooth();
		$("body").toggleClass("show-link");
		$("#tarea-link").val(generate_share_link());
		$('#tarea-link').select();

		var shareText = $('#tarea-link').val();
		var $closeBtn = $('.link-popup .close');
		var originalText = $closeBtn.text();
		function showCopiedFeedback(success){
			$closeBtn.text(success ? 'COPIED ✓ — CLOSE' : 'COPY FAILED — CLOSE');
			setTimeout(function(){ $closeBtn.text(originalText); }, 1500);
		}
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(shareText).then(function(){
				showCopiedFeedback(true);
			}).catch(function(){
				try {
					var successful = document.execCommand('copy');
					showCopiedFeedback(!!successful);
				} catch (err) {
					showCopiedFeedback(false);
				}
			});
		} else {
			try {
				var successful = document.execCommand('copy');
				showCopiedFeedback(!!successful);
			} catch (err) {
				showCopiedFeedback(false);
			}
		}
	});

	$('.link-popup .close').on('click',function(){
		$("body").toggleClass("show-link");
	});

	$('.shuffle').on('click',function(){
		shuffle_leaderboard_cards();
	});

	$('.refresh').on('click',function(){
		build_leaderboard_cards();
		AudioEngine.playFlip();
	});
}

function initialize_card_btn_listeners() {
	$('.card .card-cover').on('click',function(){
		var $content = $(this).parent();
		var isOpening = !$content.hasClass("open");
		$content.toggleClass("open");

		if (isOpening) {
			AudioEngine.playFlip();

			if (plusPressed) {
				$content.children('.icon').text(emojis[getRandomInt(0,emojis.length)]);
				$content.children('.score').removeClass("red yellow").addClass("green").text(10);
				$content.children('.info').text("Συγχαρητήρια! Κέρδισες 10 βαθμούς");
				AudioEngine.playMilestone();
				ConfettiEngine.launch(90);
				return;
			}
			if (minusPressed) {
				$content.children('.icon').text(emojis[getRandomInt(0,emojis.length)]);
				$content.children('.score').addClass("red").removeClass("yellow green").text(-10);
				$content.children('.info').text("Ατυχία! Μόλις έχασες 10 βαθμούς");
				AudioEngine.playNegative();
				return;
			}

			// Check score value of card
			var scoreText = $content.children('.score').text();
			var parsed = parseInt(scoreText);
			if (parsed > 0) {
				AudioEngine.playPositive();
				ConfettiEngine.launch(70);
			} else if (parsed < 0) {
				AudioEngine.playNegative();
			} else {
				AudioEngine.playFlip();
			}
		}
	});
}

function build_leaderboard_cards() {
	$('.leaderboard').empty();

	if (data.length == 0) return;

	data = shuffleArray(data);

	data.forEach(function(card) {
		$('.leaderboard').append(
			template.replace(/{{icon}}/gm,card.icon)
					.replace(/{{info}}/gm,card.info)
					.replace(/{{score}}/gm,card.score));
	});

	leaderboard_iso.isotope('reloadItems');
	add_card_numbers();
	add_card_colors();

	localStorage.setItem('leaderboard_card_data', JSON.stringify(data));
	initialize_card_btn_listeners();
	leaderboard_iso.isotope();
}

function read_data_from_text(data_str) {
	data = [];
	if (data_str == "") {return;}
	var lines = data_str.split('\n');
	lines.forEach(function(line) {
		tokens = line.split(',');
		if (tokens.length >= 3) {
			data.push({
				icon:  tokens[0].trim(),
				score: tokens[1].trim(),
				info:  tokens[2].trim()
			});
		}
	});
}

function getRandomInt(min, max) {
    min = Math.ceil(min);
    max = Math.floor(max);
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generate_share_link() {
	base64_str = btoa(encodeURIComponent(JSON.stringify(data)));
	share_url = new URL( [location.protocol, '//', location.host, location.pathname].join('') );
	share_url.searchParams.append("q",base64_str);
	return share_url.href;
}

function scroll_to_top_smooth() {
	window.scrollTo({ top: 0 });
}

function test_local_storage(){
    var test = 'test';
    try {
        localStorage.setItem(test, test);
        localStorage.removeItem(test);
        local_storage_available = true;
    } catch(e) {
        local_storage_available = false;
    }
}

function shuffleArray(array) {
	for (var i = array.length - 1; i > 0; i--) {
		var j = Math.floor(Math.random() * (i + 1));
		var temp = array[i];
		array[i] = array[j];
		array[j] = temp;
	}
	return array;
}
